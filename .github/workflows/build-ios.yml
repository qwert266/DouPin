name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show project info
        run: xcodebuild -project DouPin.xcodeproj -list

      - name: Inject build info
        run: |
          set -euxo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "Injecting BuildInfo: commit=$COMMIT builtAt=$BUILT_AT"
          cat > Sources/App/BuildInfo.swift <<SWIFT
          import Foundation

          /// 构建信息（由 CI 生成，勿手改）
          enum BuildInfo {
              static let commit = "$COMMIT"
              static let builtAt = "$BUILT_AT"
          }
          SWIFT
          cat Sources/App/BuildInfo.swift

      - name: Build unsigned IPA
        run: |
          set -euxo pipefail
          xcodebuild -project DouPin.xcodeproj \
            -scheme DouPin \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DouPin.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean archive

          mkdir -p build/Payload
          cp -R "build/DouPin.xcarchive/Products/Applications/DouPin.app" build/Payload/
          cd build
          zip -qry DouPin-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouPin-unsigned-ipa
          path: build/DouPin-unsigned.ipa
          if-no-files-found: error
